function checkEmails() {
  var a = document.getElementById("f-email").value.trim().toLowerCase();
  var b = document.getElementById("f-email2");
  var same = a === b.value.trim().toLowerCase();
  b.setCustomValidity(same ? "" : langData[currentLang].mismatch);
}
document.getElementById("f-email").addEventListener("input", checkEmails);
document.getElementById("f-email2").addEventListener("input", checkEmails);
var statusKey = null;
function renderStatus() {
  var el = document.getElementById("status");
  if (!statusKey) { el.className = "status"; el.textContent = ""; return; }
  el.className = "status " + (statusKey === "thanks" ? "ok" : "err");
  el.textContent = langData[currentLang][statusKey];
}
var currentLang = "en";
function updatePageLanguage(code) {
  var lang = langData[code] ? code : "en";
  var d = langData[lang];
  document.documentElement.lang = lang;
  document.getElementById("lang-menu").value = lang;
  document.getElementById("t-badge").textContent = d.badge;
  document.getElementById("t-title").textContent = d.title;
  document.getElementById("t-pitch").textContent = d.pitch;
  document.getElementById("t-b1-head").textContent = d.b1h;
  document.getElementById("t-b1-text").textContent = d.b1t;
  document.getElementById("t-b2-head").textContent = d.b2h;
  document.getElementById("t-b2-text").textContent = d.b2t;
  document.getElementById("f-name").placeholder = d.name;
  document.getElementById("f-company").placeholder = d.company;
  document.getElementById("f-email").placeholder = d.email;
  document.getElementById("f-offer").placeholder = d.offer;
  document.getElementById("f-msg").placeholder = d.msg;
  document.getElementById("t-btn").textContent = d.btn;
  document.getElementById("t-seller").textContent = d.seller;
  document.title = "valuta.com – " + d.badge;
  document.getElementById("t-ideas-head").textContent = d.ideasHead;
  var ul = document.getElementById("t-ideas");
  ul.innerHTML = "";
  d.ideas.forEach(function (txt) {
    var li = document.createElement("li");
    li.textContent = txt;
    ul.appendChild(li);
  });
  document.getElementById("f-email2").placeholder = d.email2;
  document.getElementById("t-required").textContent = d.required;
  document.getElementById("t-noauto").textContent = d.noauto;
  currentLang = lang;
  checkEmails();
  renderStatus();
}

var menu = document.getElementById("lang-menu");
menu.addEventListener("change", function () {
  updatePageLanguage(this.value);
});

updatePageLanguage("en");

// Skicka utan att lämna sidan + anti-spam
var loadedAt = Date.now();
var form = document.getElementById("offer-form");
var sendBtn = document.getElementById("t-btn");
var frame = document.getElementById("hidden-frame");
var fallbackSent = false;

function showDone() {
  form.style.display = "none";
  statusKey = "thanks";
  renderStatus();
}
function showFail(detail) {
  statusKey = "error";
  sendBtn.disabled = false;
  renderStatus();
  if (detail) {
    document.getElementById("status").textContent += " (" + detail + ")";
  }
}
// Reservväg: vanlig POST till en dold iframe (ingen sidomladdning, inget nytt fönster)
function sendViaFrame() {
  fallbackSent = true;
  form.target = "hidden-frame";
  HTMLFormElement.prototype.submit.call(form);
}
frame.addEventListener("load", function () {
  if (fallbackSent) { showDone(); }
});

form.addEventListener("submit", function (e) {
  e.preventDefault();
  if (Date.now() - loadedAt < 4000 || sendBtn.disabled) { return; }
  if (form.elements["_honey"].value) { return; }
  sendBtn.disabled = true;
  statusKey = null; renderStatus();
  var data = {};
  new FormData(form).forEach(function (v, k) { data[k] = v; });
  fetch(form.action.replace("formsubmit.co/", "formsubmit.co/ajax/"), {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(data)
  })
  .then(function (r) { return r.json(); })
  .then(function (res) {
    console.log("FormSubmit svar:", res);
    if (res.success === true || res.success === "true") {
      showDone();
    } else {
      // Ofta: formuläret är inte aktiverat än. En vanlig POST skickar aktiveringsmejlet.
      sendViaFrame();
    }
  })
  .catch(function (err) {
    console.log("FormSubmit fel:", err);
    sendViaFrame();
  });
});
</script>
