<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>valuta.com är till salu / is for sale</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; padding: 20px; box-sizing: border-box; }
    .box { background: white; padding: 32px 36px 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 460px; width: 100%; }
    .lang-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .seller-tag { font-size: 13px; color: #666; font-weight: 600; background: #f0f0f5; padding: 6px 12px; border-radius: 6px; }
    .lang-btns { display: flex; gap: 6px; }
    .lang-btn { background: #f0f0f5; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: #555; }
    .lang-btn.active { background: #111; color: white; }
    h1 { color: #111; font-size: 24px; margin: 0 0 10px 0; text-align: center; }
    p.desc { color: #555; line-height: 1.5; margin: 0 0 22px 0; font-size: 15px; text-align: center; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; font-family: inherit; box-sizing: border-box; }
    input:focus, textarea:focus { outline: none; border-color: #0070f3; }
    button.submit-btn { width: 100%; padding: 14px; background: #0070f3; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 6px; }
    button.submit-btn:hover { background: #005bb5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="lang-bar">
      <span class="seller-tag" id="seller-label">Säljare: Benny</span>
      <div class="lang-btns">
        <button type="button" id="btn-sv" class="lang-btn active" onclick="setLang('sv')">Svenska</button>
        <button type="button" id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
      </div>
    </div>

    <!-- SVENSKA -->
    <div id="content-sv">
      <h1>valuta.com är till salu</h1>
      <p class="desc">Är du intresserad av att förvärva denna domän? Fyll i ditt bud nedan för att kontakta Benny direkt.</p>
      <form onsubmit="sendOffer(event, 'sv')">
        <div class="form-group">
          <label for="name-sv">Ditt namn</label>
          <input type="text" id="name-sv" required placeholder="För- och efternamn">
        </div>
        <div class="form-group">
          <label for="email-sv">Din e-postadress</label>
          <input type="email" id="email-sv" required placeholder="namn@exempel.se">
        </div>
        <div class="form-group">
          <label for="bid-sv">Ditt bud (SEK / EUR / USD)</label>
          <input type="text" id="bid-sv" required placeholder="T.ex. 25 000 kr">
        </div>
        <div class="form-group">
          <label for="msg-sv">Meddelande (valfritt)</label>
          <textarea id="msg-sv" rows="3" placeholder="Övriga frågor eller villkor..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Skicka bud till Benny</button>
      </form>
    </div>

    <!-- ENGLISH -->
    <div id="content-en" class="hidden">
      <h1>valuta.com is for sale</h1>
      <p class="desc">Interested in acquiring this domain? Submit your offer below to contact Benny directly.</p>
      <form onsubmit="sendOffer(event, 'en')">
        <div class="form-group">
          <label for="name-en">Your name</label>
          <input type="text" id="name-en" required placeholder="Full name">
        </div>
        <div class="form-group">
          <label for="email-en">Your email</label>
          <input type="email" id="email-en" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="bid-en">Your offer (EUR / USD / SEK)</label>
          <input type="text" id="bid-en" required placeholder="E.g. €2,500">
        </div>
        <div class="form-group">
          <label for="msg-en">Message (optional)</label>
          <textarea id="msg-en" rows="3" placeholder="Any questions or terms..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Send offer to Benny</button>
      </form>
    </div>
  </div>

  <script>
    function setLang(lang) {
      document.getElementById('content-sv').classList.toggle('hidden', lang !== 'sv');
      document.getElementById('content-en').classList.toggle('hidden', lang !== 'en');
      document.getElementById('btn-sv').classList.toggle('active', lang === 'sv');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('seller-label').textContent = lang === 'sv' ? 'Säljare: Benny' : 'Seller: Benny';
    }

    function sendOffer(e, lang) {
      e.preventDefault();
      // Spamskydd: dela upp din e-postadress i två delar nedan
      const user = "bp_andersen";
      const domain = "hotmail.com";
      const to = user + "@" + domain;

      const name = document.getElementById('name-' + lang).value;
      const email = document.getElementById('email-' + lang).value;
      const bid = document.getElementById('bid-' + lang).value;
      const msg = document.getElementById('msg-' + lang).value;

      const subject = lang === 'sv'
        ? "Bud på valuta.com: " + bid
        : "Offer for valuta.com: " + bid;

      const body = lang === 'sv'
        ? "Hej Benny,\n\nJag vill lämna ett bud på domänen valuta.com.\n\nBud: " + bid + "\nNamn: " + name + "\nE-post: " + email + "\nMeddelande: " + msg
        : "Hi Benny,\n\nI would like to make an offer for the domain valuta.com.\n\nOffer: " + bid + "\nName: " + name + "\nEmail: " + email + "\nMessage: " + msg;

      window.location.href = "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    }
  </script>
</body>
</html>
